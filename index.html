<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#669933;--gd:#4d7a26;--gl:#7ab83d;
  --gsel:#eef5e6;--gselb:#c2de99;
  --blk:#282A2B;--wh:#EFEFEF;--gr:#545454;--gr2:#767676;
  --b1:#D1D5DB;--b2:#E5E7EB;--b3:#F3F4F6;
  --am:#B45309;--amb:#FEF3C7;--re:#DC2626;--reb:#FEF2F2;
  --bg:#F7F7F5;--fh:'Poppins',sans-serif;--fb:'Mulish',sans-serif;
}
html,body{height:100%;font-family:var(--fb)}
body{display:flex;justify-content:center;align-items:flex-start;background:#E8E4DE;padding:40px 20px;min-height:100vh}
@media(max-width:440px){body{padding:0;background:var(--bg);align-items:stretch}}
.ph{width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;flex-shrink:0}
@media(min-width:441px){.ph{border-radius:44px;border:1.5px solid #C9CDD4;box-shadow:0 20px 60px rgba(0,0,0,.15)}}
@media(max-width:440px){.ph{width:100%;height:100svh}}
.sbar{height:50px;background:var(--wh);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0;border-bottom:1px solid var(--b2)}
.stime{font-size:15px;font-weight:700;color:var(--blk);font-family:var(--fh)}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.sc::-webkit-scrollbar{display:none}
.bnav{height:78px;background:var(--wh);border-top:1.5px solid var(--b2);display:flex;align-items:center;justify-content:space-around;padding:0 4px 10px;flex-shrink:0}
.bnav.off{display:none}
.nt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border:none;background:none;cursor:pointer;font-family:var(--fb);position:relative;color:#1F2937;-webkit-tap-highlight-color:transparent}
.nt.on{color:var(--g)}.nt-bar{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--g);border-radius:0 0 3px 3px;display:none}
.nt.on .nt-bar{display:block}.nt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nt span{font-size:10px;font-weight:700;letter-spacing:.2px}
.tst{position:absolute;bottom:92px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--blk);color:var(--wh);padding:9px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:99;font-family:var(--fb)}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.card{background:var(--wh);border-radius:14px;border:1px solid var(--b1);padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-t{font-size:11px;font-weight:700;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;font-family:var(--fh)}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--wh);border-bottom:1.5px solid var(--b2);flex-shrink:0}
.hdrt{font-size:16px;font-weight:700;color:var(--blk);flex:1;font-family:var(--fh)}
.bk{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--b1);background:var(--wh);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.bk svg{width:16px;height:16px;stroke:var(--blk);fill:none;stroke-width:2;stroke-linecap:round}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--b3)}.row:last-child{border-bottom:none}
.rk{font-size:13px;font-weight:500;color:var(--gr)}.rv{font-size:13px;font-weight:700;color:var(--blk);text-align:right;max-width:60%}.rv.g{color:var(--gd)}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--fh)}
.cg{background:var(--gsel);color:var(--gd)}.ca{background:var(--amb);color:var(--am)}.cn{background:var(--b2);color:var(--gr)}.cg2{background:var(--gsel);color:var(--gd);border:1px solid var(--gselb)}
.btn{width:100%;padding:15px 20px;border-radius:12px;font-size:15px;font-family:var(--fh);font-weight:700;cursor:pointer;border:none;display:block;-webkit-tap-highlight-color:transparent}
.bp{background:var(--g);color:#fff;border:2px solid var(--gd)}.bp:active{background:var(--gd)}
.bs{background:var(--wh);color:var(--gr);border:2px solid var(--b1)}.bs:active{background:var(--bg)}
.fi{width:100%;padding:13px 15px;border:1.5px solid var(--b1);border-radius:12px;font-family:var(--fb);font-size:14px;color:var(--blk);background:var(--wh);outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--g)}
.fld{margin-bottom:16px}.flbl{font-size:12px;font-weight:700;color:var(--gr);margin-bottom:7px;font-family:var(--fh)}
.li{background:var(--wh);border-radius:14px;border:1px solid var(--b1);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.li:active{background:var(--bg)}.lic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lib{flex:1;min-width:0}.litt{font-size:14px;font-weight:700;color:var(--blk);font-family:var(--fh)}.lisc{font-size:12px;font-weight:500;color:var(--gr);margin-top:2px}
.lir{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tile{background:var(--wh);border:1px solid var(--b1);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:9px;position:relative;-webkit-tap-highlight-color:transparent}
.tile:active{background:var(--gsel)}.tic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tic svg{width:18px;height:18px;stroke:var(--gr);fill:none;stroke-width:1.8;stroke-linecap:round}
.tn{font-size:13px;font-weight:700;color:var(--blk);font-family:var(--fh)}.td{font-size:11px;font-weight:500;color:var(--gr);margin-top:1px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sect{font-size:14px;font-weight:700;color:var(--blk);font-family:var(--fh)}.seca{font-size:12px;font-weight:700;color:var(--g);background:none;border:none;cursor:pointer;font-family:var(--fh)}
.impact-card{background:var(--blk);border-radius:16px;padding:20px;margin-bottom:12px}
.ic-label{font-size:10px;font-weight:700;color:rgba(239,239,239,.45);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--fh);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ic-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--g);flex-shrink:0}
.ic-row{display:flex;gap:12px}
.ic-stat{flex:1;background:rgba(255,255,255,.06);border-radius:10px;padding:13px;border:1px solid rgba(255,255,255,.06)}
.ic-val{font-family:var(--fh);font-weight:800;font-size:22px;color:var(--wh);line-height:1;margin-bottom:3px}
.ic-val span{font-size:12px;font-weight:600;color:var(--g)}
.ic-sub{font-size:10px;font-weight:600;color:rgba(239,239,239,.4);line-height:1.4}
.err{background:var(--reb);border:1px solid #FECACA;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none;font-size:13px;font-weight:600;color:var(--re)}
.err.on{display:block}
.load{position:absolute;inset:0;background:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200}
.load.off{display:none}
.spin{width:40px;height:40px;border:3px solid rgba(239,239,239,.15);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sw{background:var(--wh);border:1px solid var(--b1);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.sw:active{background:var(--gsel)}
.sw-l{flex:1}.sw-t{font-size:13px;font-weight:700;color:var(--blk);font-family:var(--fh)}.sw-s{font-size:11px;font-weight:500;color:var(--gr);margin-top:2px}
.sw-ic{width:32px;height:32px;border-radius:50%;background:var(--gsel);display:flex;align-items:center;justify-content:center}
.sw-ic svg{width:14px;height:14px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round}
.pill{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--b1);background:var(--wh);cursor:pointer;white-space:nowrap;color:var(--gr);font-family:var(--fh)}
.pill.on{background:var(--g);border-color:var(--gd);color:#fff}
.pills{display:flex;gap:7px;overflow-x:auto}.pills::-webkit-scrollbar{display:none}
.mit{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:14px;cursor:pointer;background:var(--wh);border:1px solid var(--b1);margin-bottom:10px}
.mit:active{background:var(--bg)}.mic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}.mitt{font-size:14px;font-weight:700;color:var(--blk);flex:1;font-family:var(--fh)}
.chv svg{width:15px;height:15px;stroke:var(--gr);fill:none;stroke-width:2;stroke-linecap:round}
.faqit{border-bottom:1px solid var(--b2)}.faqq{display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer}
.faqq-t{font-size:14px;font-weight:700;color:var(--blk);flex:1;padding-right:8px;font-family:var(--fh)}.faqq svg{width:15px;height:15px;stroke:var(--gr);fill:none;stroke-width:2;stroke-linecap:round;transition:.2s;flex-shrink:0}
.faqit.op .faqq svg{transform:rotate(180deg)}.faqa{font-size:13px;font-weight:500;color:var(--gr);padding:0 0 14px;line-height:1.6;display:none}
.faqit.op .faqa{display:block}
.tally-wrap iframe{width:100%;border:none;display:block;min-height:500px;border-radius:14px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end}
.modal-bg.off{display:none}
.modal{background:var(--wh);border-radius:20px 20px 0 0;width:100%;padding:20px;max-height:80%}
.modal-t{font-family:var(--fh);font-size:16px;font-weight:800;color:var(--blk);margin-bottom:16px}
.contract-opt{padding:14px 16px;border-radius:12px;border:1.5px solid var(--b1);cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.contract-opt:active{background:var(--gsel)}.contract-opt.on{border-color:var(--g);background:var(--gsel)}
.co-ic{width:40px;height:40px;border-radius:10px;background:var(--gsel);display:flex;align-items:center;justify-content:center}
.co-ic svg{width:18px;height:18px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round}
.trow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--b3)}.trow:last-child{border-bottom:none}
.tdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;border:2px solid var(--b1);background:var(--bg)}
.tdot.ok{background:var(--gsel);border-color:var(--gselb)}.tdot.ok svg{width:11px;height:11px;stroke:var(--g);fill:none;stroke-width:2.2;stroke-linecap:round}
.tname{font-size:13px;font-weight:700;color:var(--blk);font-family:var(--fh)}.tname.dim{color:var(--gr2)}.tsub{font-size:11px;font-weight:500;color:var(--gr2);margin-top:2px}

/* ── CHAT ── */
.cm{display:flex;gap:9px;align-items:flex-end;max-width:88%}
.cm.u{flex-direction:row-reverse;align-self:flex-end;max-width:88%}
.cm.bot{align-self:flex-start}
.cav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-family:var(--fh);flex-shrink:0}
.cb{padding:11px 14px;border-radius:18px;font-size:13.5px;font-weight:500;line-height:1.55;max-width:100%}
.cm.bot .cb{background:var(--wh);color:var(--blk);border-radius:4px 18px 18px 18px;border:1px solid var(--b1);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.cm.u .cb{background:var(--g);color:#fff;border-radius:18px 4px 18px 18px}
.tyd{width:7px;height:7px;border-radius:50%;background:var(--g);opacity:.4;animation:tydp 1.2s infinite}
.tyd:nth-child(2){animation-delay:.2s}
.tyd:nth-child(3){animation-delay:.4s}
@keyframes tydp{0%,80%,100%{transform:scale(0.7);opacity:.3}40%{transform:scale(1);opacity:1}}
.ci{flex:1;padding:11px 16px;border:1.5px solid var(--b1);border-radius:24px;font-family:var(--fb);font-size:14px;color:var(--blk);background:var(--bg);outline:none;-webkit-appearance:none}
.ci:focus{border-color:var(--g);background:var(--wh)}
.csnd{width:42px;height:42px;border-radius:50%;background:var(--g);border:2px solid var(--gd);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.csnd:active{background:var(--gd)}
.chat-date{font-size:10px;font-weight:600;color:var(--gr2);text-align:center;margin:4px 0}
</style>

<body>
<div class="ph" id="ph">
  <div class="sbar"><span class="stime" id="st">9:41</span>
    <div style="display:flex;gap:5px;align-items:center">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="var(--blk)"><rect x="0" y="5" width="3" height="6" rx="1" opacity=".25"/><rect x="4.5" y="3" width="3" height="8" rx="1" opacity=".5"/><rect x="9" y="1" width="3" height="10" rx="1" opacity=".75"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3" stroke="var(--blk)" stroke-opacity=".25"/><rect x="2" y="2" width="19" height="9" rx="2" fill="var(--blk)"/><path d="M24 4.5v4c1.2-.7 1.2-3.3 0-4z" fill="var(--blk)" opacity=".4"/></svg>
    </div>
  </div>
  <div class="load off" id="loader"><div class="spin"></div><div style="font-family:var(--fh);font-size:13px;font-weight:700;color:rgba(239,239,239,.5)" id="loadtxt">Laden...</div></div>
  <div class="modal-bg off" id="contract-modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-t">Kies een contract</div>
      <div id="contract-list"></div>
      <button class="btn bs" onclick="sluitModal()" style="margin-top:4px">Annuleren</button>
    </div>
  </div>
  <div class="sc" id="sc"></div>
  <nav class="bnav off" id="bn"></nav>
  <div class="tst" id="tst"></div>
</div>

<script>
/* ============================================
   SUPABASE CONFIG
   ============================================ */
const SB_URL = 'https://puzxtiqtoipsqhavocez.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1enh0aXF0b2lwc3FoYXZvY2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDY3MzksImV4cCI6MjA5MzcyMjczOX0.hvHNl9tHyoip3U2OLbXsjAza6U5Uh0vgHCDMTmlsNJc';

const sb = window.supabase.createClient(SB_URL, SB_KEY);


/* ============================================
   STATE
   ============================================ */
let CONTRACTEN = [];
let IDX = 0; // actief contract index
let USER = null;
const S = {sc:'login', p:{}, stk:[], authMode:'login', invFilter:'all', faqTab:'faq', faqCat:'all'};

/* ============================================
   SUPABASE AUTH
   ============================================ */
sb.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    USER = session.user;
    if (event !== 'INITIAL_SESSION') {
      toonLoader('Contracten ophalen...');
    }
    await laadContracten();
  } else {
    USER = null;
    CONTRACTEN = [];
    verbergLoader();
    if (S.sc !== 'login') { S.sc = 'login'; S.stk = []; R(); }
  }
});

async function laadContracten() {
  try {
    const { data, error } = await Promise.race([
      sb.from('contracten').select('*').eq('email', USER.email).order('startdatum', {ascending: false}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Verbinding te traag. Probeer opnieuw.')), 8000))
    ]);
    if (error) throw error;
    CONTRACTEN = data || [];
  } catch(e) {
    verbergLoader();
    toast('Contracten laden mislukt: ' + e.message);
    return;
  }
  IDX = 0;
  S.sc = 'home';
  S.stk = [];
  verbergLoader();
  R();
}

async function doLogin(email, ww) {
  toonLoader('Inloggen...');
  const { error } = await sb.auth.signInWithPassword({email, password: ww});
  if (error) {
    verbergLoader();
    toonFout('login-err', error.message === 'Invalid login credentials' ? 'E-mail of wachtwoord klopt niet.' : error.message);
  }
}

async function doRegister(email, ww) {
  toonLoader('Account aanmaken...');
  const { error } = await sb.auth.signUp({email, password: ww});
  if (error) {
    verbergLoader();
    toonFout('login-err', error.message.includes('already registered') ? 'Dit e-mailadres is al in gebruik.' : error.message);
  } else {
    verbergLoader();
    toonFout('login-err', 'Bevestigingsmail verstuurd! Klik op de link in uw mail om in te loggen.');
    document.getElementById('login-err').style.background='var(--gsel)';
    document.getElementById('login-err').style.color='var(--gd)';
    document.getElementById('login-err').style.border='1px solid var(--gselb)';
  }
}

async function uitloggen() {
  await sb.auth.signOut();
  CONTRACTEN = []; USER = null; IDX = 0;
  S.sc = 'login'; S.stk = []; S.authMode = 'login';
  R();
}

/* ============================================
   HELPERS
   ============================================ */
const C = () => CONTRACTEN[IDX];
const go = (s,p={},stk=true) => { if(stk&&S.sc!=='login') S.stk.push({s:S.sc,p:S.p}); S.sc=s; S.p=p; R(); };
const back = () => { const v=S.stk.pop(); if(v){S.sc=v.s;S.p=v.p;R();}else go('home'); };
const toast = m => { const t=document.getElementById('tst'); t.textContent=m; t.className='tst on'; setTimeout(()=>t.className='tst',2400); };
const ico = (d,s=22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const pct = () => Math.round(C().maanden_verstreken/C().contracttijd*100);
const KM = () => Math.round(C().maanden_verstreken/12*3500);
const CO2 = () => Math.round(KM()*0.120);
const BES = () => Math.round((530-C().maandbedrag)*C().maanden_verstreken);
const BMAP = () => Math.round(530-C().maandbedrag);
const toonLoader = (t='Laden...') => { document.getElementById('loader').className='load'; document.getElementById('loadtxt').textContent=t; };
const verbergLoader = () => { document.getElementById('loader').className='load off'; };
const toonFout = (id,t) => { const e=document.getElementById(id); if(e){e.textContent=t;e.className='err on';} };
const verbergFout = id => { const e=document.getElementById(id); if(e)e.className='err'; };

function sCh(s) {
  return s==='completed'?`<span class="chip cg">Afgerond</span>`:s==='assigned'?`<span class="chip cg2">Toegewezen</span>`:s==='in_progress'?`<span class="chip ca">Bezig</span>`:`<span class="chip cn">Ingediend</span>`;
}

function toonContractKiezer() {
  const el = document.getElementById('contract-modal');
  const list = document.getElementById('contract-list');
  list.innerHTML = CONTRACTEN.map((c,i) => `
    <div class="contract-opt ${i===IDX?'on':''}" onclick="kiesContract(${i})">
      <div class="co-ic">${ico('<circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 18l3.5-9 5.5 3L17 5 19.5 18"/>',18)}</div>
      <div><div style="font-family:var(--fh);font-size:14px;font-weight:700;color:var(--blk)">${c.merk} ${c.model}</div>
      <div style="font-size:12px;font-weight:500;color:var(--gr);margin-top:2px">${c.contractnummer}</div></div>

function navH() {
  const sc = S.sc;
  const nb = (icn,lbl,id) => `<button class="nt ${sc===id||sc.startsWith(id+'_')?'on':''}" onclick="go('${id}')"><div class="nt-bar"></div>${ico(icn)}<span>${lbl}</span></button>`;
  return nb('<path d="M3 12L12 3l9 9v9H15v-6H9v6H3V12z"/>','Home','home')
    +nb('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>','Contract','contract')
    +nb('<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>','Service','svc_list')
    +nb('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>','FAQ','faq')
    +nb('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>','Profiel','profile');
}

function R() {
  const sc=document.getElementById('sc'), bn=document.getElementById('bn');
  const noNav=['login'].includes(S.sc);
  bn.className=noNav?'bnav off':'bnav';
  if(!noNav) bn.innerHTML=navH();
  const M={login:scLogin,home:scHome,contract:scCon,invoices:scInv,bike:scBike,svc_list:scSvcList,svc_new:scSvcNew,svc_detail:scSvcDet,faq:scFaq,profile:scPro,contact:scContact,persoonsgegevens:scPersoonsgegevens,wachtwoord:scWachtwoordWijzigen};
  const isChat = S.sc==='faq' && S.faqTab==='chat';
  sc.style.overflow = isChat ? 'hidden' : '';
  sc.style.display = isChat ? 'flex' : '';
  sc.style.flexDirection = isChat ? 'column' : '';
  sc.innerHTML=(M[S.sc]||scHome)();
  if(!isChat) sc.scrollTop=0;
}

function handleAuth() {
  const em=document.getElementById('em')?.value?.trim();
  const pw=document.getElementById('pw')?.value;
  const pw2=document.getElementById('pw2')?.value;
  verbergFout('login-err');
  if(!em||!pw){toonFout('login-err','Vul alle velden in.');return;}
  if(S.authMode==='register'){
    if(pw!==pw2){toonFout('login-err','Wachtwoorden komen niet overeen.');return;}
    if(pw.length<8){toonFout('login-err','Wachtwoord moet minimaal 8 tekens zijn.');return;}
    doRegister(em,pw);
  }else{
    doLogin(em,pw);
  }
}

  {id:'f11',cat:'verzekering',vraag:'Wat is het eigen risico van de verzekering?',antwoord:'Het eigen risico bedraagt 5% van de schade per gebeurtenis, met een minimum van €50. Dit geldt zowel bij schade als bij diefstal.'},
  {id:'f12',cat:'verzekering',vraag:'Zijn accessoires meeverzekerd?',antwoord:'Accessoires en onderdelen die bij de oorspronkelijke levering zijn meegeleverd, zijn meeverzekerd. Accessoires die u achteraf zelf heeft aangeschaft of laten monteren, vallen niet onder de verzekering.'},

  <button onclick="chatHistory=[{r:'bot',t:'Hallo! Ik ben de assistent van Fietslease Holland. Stel gerust een vraag.'}];R()" style="font-size:11px;font-weight:600;color:var(--gr2);background:none;border:1px solid var(--b1);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:var(--fh)">Wis</button>
</div>
<div id="chatb" style="flex:1;overflow-y:auto;background:var(--bg);padding:16px 14px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end">
  <div class="chat-date">Vandaag</div>
  ${msgs}
</div>
<div style="padding:10px 14px 14px;border-top:1.5px solid var(--b2);background:var(--wh);display:flex;gap:8px;align-items:center">
  <input class="ci" id="ci" placeholder="Stel uw vraag over uw lease…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"/>
  <button class="csnd" onclick="sendChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>

}

function iChat() {
  const i = document.getElementById('ci');
  if(i) i.focus();
  const m = document.getElementById('chatb');
  if(m) m.scrollTop = m.scrollHeight;
}

async function sendChat() {
  const i = document.getElementById('ci');
  if(!i) return;
  const txt = i.value.trim();
  if (!txt) return;
  i.value = '';

  chatHistory.push({r:'user', t:txt}, {r:'typing', t:''});
  R();
  setTimeout(()=>{const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;},60);

  try {
    const c = C();
    const faqTekst = DEMO_FAQ.map(f => 'V: ' + f.vraag + '\nA: ' + f.antwoord).join('\n\n');
    const systeem = 'U bent de klantenservice-assistent van Fietslease Holland. U vertegenwoordigt het bedrijf professioneel en spreekt klanten altijd aan met "u".\n\nGEDRAGSREGELS:\n- Schrijf volledige, nette zinnen \u2014 geen opsommingen tenzij het antwoord dat vereist.\n- Geef altijd een volledig en informatief antwoord; wees niet t\u00e9 kort.\n- Gebruik uitsluitend de FAQ en de klantgegevens hieronder als informatiebron. Verzin nooit gegevens.\n- Als het antwoord niet in de FAQ staat, verwijs u vriendelijk door naar 085-9022111 of klantenservice@fietsleaseholland.nl (maandag t/m vrijdag 9:00\u201317:00 uur).\n- Spreek de klant bij naam aan wanneer dat natuurlijk aanvoelt.\n- Sluit een antwoord altijd af met een aanbod voor verdere hulp, zoals: "Heeft u nog andere vragen?"\n- Schrijf altijd in het Nederlands.\n\nKLANTGEGEVENS:\nNaam: ' + c.naam + '\nContractnummer: ' + c.contractnummer + '\nFiets: ' + c.merk + ' ' + c.model + '\nMaandbedrag: \u20ac' + c.maandbedrag + '\nEinddatum contract: ' + c.einddatum + '\n\nFAQ:\n' + faqTekst;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        temperature: 0,
        system: systeem,
        messages: [{role:'user', content: txt}]
      })
    });
    const data = await res.json();
    chatHistory = chatHistory.filter(m=>m.r!=='typing');
    chatHistory.push({r:'bot', t: data.content?.[0]?.text || 'Bel ons: 085-9022111 (ma–vr 9–17u).'});
  } catch(e) {
    chatHistory = chatHistory.filter(m=>m.r!=='typing');
    chatHistory.push({r:'bot', t:'Er is een fout opgetreden. Bel ons op 085-9022111 (ma–vr 9–17u).'});
  }
  R();
  setTimeout(()=>{const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;},80);
}

   ============================================ */
function scWachtwoordWijzigen() {
  return `<div class="hdr"><button class="bk" onclick="back()"><svg viewBox="0 0 16 16" fill="none" stroke="var(--blk)" stroke-width="2" stroke-linecap="round"><path d="M10 4l-6 4 6 4"/></svg></button><div class="hdrt">Wachtwoord wijzigen</div></div>
<div style="padding:16px 18px;background:var(--bg)">
  <div class="card">
    <div class="card-t">Nieuw wachtwoord instellen</div>
    <div id="ww-err" class="err"></div>
    <div class="fld"><div class="flbl">Nieuw wachtwoord</div><input class="fi" id="ww-new" type="password" placeholder="••••••••" autocomplete="new-password"></div>
    <div class="fld"><div class="flbl">Bevestig nieuw wachtwoord</div><input class="fi" id="ww-new2" type="password" placeholder="••••••••" autocomplete="new-password"></div>
    <button onclick="doWachtwoordWijzigen()" class="btn bp" style="margin-top:4px">Opslaan</button>
  </div>
  <div style="height:14px"></div>
</div>`;
}

async function doWachtwoordWijzigen() {
  const nw = document.getElementById('ww-new')?.value;
  const nw2 = document.getElementById('ww-new2')?.value;
  verbergFout('ww-err');
  if (!nw || !nw2) { toonFout('ww-err', 'Vul alle velden in.'); return; }
  if (nw !== nw2) { toonFout('ww-err', 'Wachtwoorden komen niet overeen.'); return; }
  if (nw.length < 8) { toonFout('ww-err', 'Wachtwoord moet minimaal 8 tekens zijn.'); return; }
  toonLoader('Wachtwoord wijzigen...');
  const { error } = await sb.auth.updateUser({ password: nw });
  verbergLoader();
  if (error) { toonFout('ww-err', error.message); return; }
  toast('Wachtwoord succesvol gewijzigd.');
  back();
}
