    const res = await fetch(MAKE_WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({contractnummer})
    });
    if (!res.ok) throw new Error('Make webhook gaf foutcode: ' + res.status);
    const data = await res.json();
    return data;
  } catch(e) {
    console.error('Make webhook fout:', e);
    return null;
  }
}

function verwerkMakeData(data) {
  if (!data) return;
  // Klant
  if (data.klant) {
    if (data.klant.naam) DB.klant.naam = data.klant.naam;
    if (data.klant.email) DB.klant.email = data.klant.email;
    if (data.klant.telefoon) DB.klant.telefoon = data.klant.telefoon;
    if (data.klant.initialen) DB.klant.initialen = data.klant.initialen;
    if (data.klant.lidSinds) DB.klant.lidSinds = data.klant.lidSinds;
  }
  // Contract
  if (data.contract) {
    if (data.contract.id) DB.contract.id = data.contract.id;
    if (data.contract.maandbedrag) DB.contract.maandbedrag = parseFloat(data.contract.maandbedrag);
    if (data.contract.eigenBijdrage) DB.contract.eigenBijdrage = parseFloat(data.contract.eigenBijdrage);
    if (data.contract.werkgeversbijdrage) DB.contract.werkgeversbijdrage = parseFloat(data.contract.werkgeversbijdrage);
    if (data.contract.startdatum) DB.contract.startdatum = data.contract.startdatum;
    if (data.contract.einddatum) DB.contract.einddatum = data.contract.einddatum;
    if (data.contract.maandenVerstreken) DB.contract.maandenVerstreken = parseInt(data.contract.maandenVerstreken);
    if (data.contract.looptijdMaanden) DB.contract.looptijdMaanden = parseInt(data.contract.looptijdMaanden);
    if (data.contract.werkgever) DB.contract.werkgever = data.contract.werkgever;
    if (data.contract.status) DB.contract.status = data.contract.status;
  }
  // Fiets
  if (data.fiets) {
    if (data.fiets.merk) DB.fiets.merk = data.fiets.merk;
    if (data.fiets.model) DB.fiets.model = data.fiets.model;
    if (data.fiets.framenummer) DB.fiets.framenummer = data.fiets.framenummer;
    if (data.fiets.fotoUrl) DB.fiets.fotoUrl = data.fiets.fotoUrl;
    if (data.fiets.garantieTot) DB.fiets.garantieTot = data.fiets.garantieTot;
    if (data.fiets.batterijWh) DB.fiets.batterijWh = data.fiets.batterijWh;
    if (data.fiets.kleur) DB.fiets.kleur = data.fiets.kleur;
    if (data.fiets.bouwjaar) DB.fiets.bouwjaar = data.fiets.bouwjaar;
  }
  // Facturen
  if (data.facturen && Array.isArray(data.facturen)) DB.facturen = data.facturen;
  // Service
  if (data.servicemeldingen && Array.isArray(data.servicemeldingen)) DB.servicemeldingen = data.servicemeldingen;
}

function genQR(tok){
  const N=21,C=10,SZ=N*C+20,g=Array.from({length:N},()=>new Array(N).fill(0));
  const fn=(r,c)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(r+i<N&&c+j<N)g[r+i][c+j]=(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))?1:0;};
  fn(0,0);fn(0,14);fn(14,0);for(let i=8;i<13;i++){g[6][i]=i%2===0?1:0;g[i][6]=i%2===0?1:0;}
  let sd=0;for(const ch of tok)sd=(sd*31+ch.charCodeAt(0))&0xffffff;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if((r<8&&c<8)||(r<8&&c>=13)||(r>=13&&c<8)||r===6||c===6)continue;if(g[r][c])continue;sd=(sd*1664525+1013904223)&0xffffffff;g[r][c]=(sd>>>16)%3===0?1:0;}
  let rx='';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c])rx+=`<rect x="${c*C+10}" y="${r*C+10}" width="${C}" height="${C}" rx="1.5" fill="#282A2B"/>`;
  const mx=Math.floor(SZ/2),my=Math.floor(SZ/2);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${SZ}" height="${SZ}" viewBox="0 0 ${SZ} ${SZ}"><rect fill="#EFEFEF" width="${SZ}" height="${SZ}" rx="10"/>${rx}<rect x="${mx-22}" y="${my-11}" width="44" height="22" fill="#EFEFEF"/><text x="${mx-18}" y="${my+5}" font-family="'Poppins',sans-serif" font-size="7" font-weight="800" fill="#669933">FLH</text></svg>`;
}

async function doLogin(){
  const cnr=document.getElementById('cnr')?.value?.trim().toUpperCase();
  const pc=document.getElementById('pc')?.value?.trim().toUpperCase();
  const errBox=document.getElementById('err-box');
  const errTekst=document.getElementById('err-tekst');

  errBox?.classList.remove('show');

  if(!cnr){errTekst.textContent='Vul uw contractnummer in.';errBox.classList.add('show');return;}
  if(!pc){errTekst.textContent='Vul uw postcode in.';errBox.classList.add('show');return;}

  // Loading tonen
  document.getElementById('loading').classList.remove('hidden');

  try {
    const data = await haalDataOp(cnr);
    if(data){
      // Controleer postcode als Make dat teruggeeft
      if(data.postcode && data.postcode.replace(/\s/g,'').toUpperCase() !== pc.replace(/\s/g,'')){
        document.getElementById('loading').classList.add('hidden');
        errTekst.textContent='Contractnummer en postcode komen niet overeen.';
        errBox.classList.add('show');
        return;
      }
      verwerkMakeData(data);
    }
    // Demo modus of Make gaf data terug — ga naar home
    document.getElementById('loading').classList.add('hidden');
    S.stack=[];
    go('home',{},false);
  } catch(e) {
    document.getElementById('loading').classList.add('hidden');
    errTekst.textContent='Verbindingsfout. Probeer het opnieuw.';
    errBox.classList.add('show');
  }
}

    ['Persoonlijke gegevens','var(--gsel)','var(--g)','<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>'],
    ['Beveiliging & wachtwoord','var(--gsel)','var(--g)','<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'],
    ['Betaalgegevens (IBAN)','#FEF3C7','#B45309','<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>']
  ].map(([lbl,bg,col,icn])=>`<div class="mit" onclick="toast('${lbl}')"><div class="mic" style="background:${bg};color:${col}">${ico(icn,17)}</div><span class="mitt">${lbl}</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div>`).join('')}
  <div style="font-size:11px;font-weight:700;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;font-family:var(--fh)">Voorkeuren</div>
  <div class="mit" onclick="toast('Pushberichten')"><div class="mic" style="background:var(--b3);color:var(--gr)">${ico('<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>',17)}</div><span class="mitt">Pushberichten</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div>
  <button style="background:var(--reb);color:var(--re);border:2px solid #FECACA;border-radius:12px;padding:14px 20px;font-size:14px;font-weight:700;width:100%;margin-top:18px;cursor:pointer;font-family:var(--fh)" onclick="uitloggen()">Uitloggen</button>
  <div style="height:14px"></div>
</div>`;
}

/* ===== UTILITY FUNCTIONS ===== */
function markGelezen(id){const n=DB.meldingen.find(x=>x.id===id);if(n)n.gelezen=true;}
function tglFaq(id){const el=document.querySelector(`.faqit[data-id="${id}"]`);if(el){const was=el.classList.contains('op');document.querySelectorAll('.faqit').forEach(x=>x.classList.remove('op'));if(!was)el.classList.add('op');}}
function uitloggen(){DB=JSON.parse(JSON.stringify(DEMO_DATA));chatHistory=[{r:'bot',t:'Hallo! Ik ben de assistent van Fietslease Holland. Hoe kan ik u helpen?'}];S.scherm='login';S.stack=[];R();}
function iChat(){const i=document.getElementById('ci');if(i)i.focus();const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;}
function sendChat(){
  const i=document.getElementById('ci');if(!i)return;
  const txt=i.value.trim();if(!txt)return;i.value='';
  chatHistory.push({r:'user',t:txt},{r:'typing',t:''});R();
  setTimeout(()=>{
    chatHistory=chatHistory.filter(m=>m.r!=='typing');
    const l=txt.toLowerCase();
    let antw='Bedankt voor uw vraag. Belt u voor complexe zaken: '+DB.contract.accountmanagerTel+' (ma–vr 9–17u).';
    if(l.includes('contract'))antw=`Uw contract ${DB.contract.id} loopt tot ${DB.contract.einddatum}. Maandbedrag: €${DB.contract.maandbedrag.toFixed(2)}.`;
    if(l.includes('factuur')||l.includes('betaal'))antw=`Uw eigen bijdrage is €${DB.contract.eigenBijdrage.toFixed(2)}/maand. Incasso op de 1e van elke maand.`;
    if(l.includes('diefstal'))antw='Bij diefstal: aangifte bij politie, noteer het nummer en meld het via de Service tab.';
    if(l.includes('onderhoud'))antw='Uw fiets heeft recht op één grote beurt per jaar, volledig inbegrepen in uw lease.';
    chatHistory.push({r:'bot',t:antw});R();
    setTimeout(()=>{const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;},80);
  },1500);
}

/* ===== START ===== */
R();
setInterval(()=>{const e=document.getElementById('st');if(e){const n=new Date();e.textContent=`${n.getHours()}:${('0'+n.getMinutes()).slice(-2)}`;}},30000);
</script>
