function genQR(tok){
  const N=21,C=10,SZ=N*C+20,g=Array.from({length:N},()=>new Array(N).fill(0));
  const fn=(r,c)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(r+i<N&&c+j<N)g[r+i][c+j]=(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))?1:0;};
  fn(0,0);fn(0,14);fn(14,0);for(let i=8;i<13;i++){g[6][i]=i%2===0?1:0;g[i][6]=i%2===0?1:0;}
  let sd=0;for(const ch of tok)sd=(sd*31+ch.charCodeAt(0))&0xffffff;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if((r<8&&c<8)||(r<8&&c>=13)||(r>=13&&c<8)||r===6||c===6)continue;if(g[r][c])continue;sd=(sd*1664525+1013904223)&0xffffffff;g[r][c]=(sd>>>16)%3===0?1:0;}
  let rx='';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c])rx+=`<rect x="${c*C+10}" y="${r*C+10}" width="${C}" height="${C}" rx="1.5" fill="#282A2B"/>`;
  const mx=Math.floor(SZ/2),my=Math.floor(SZ/2);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${SZ}" height="${SZ}" viewBox="0 0 ${SZ} ${SZ}"><rect fill="#EFEFEF" width="${SZ}" height="${SZ}" rx="10"/>${rx}<rect x="${mx-22}" y="${my-11}" width="44" height="22" fill="#EFEFEF"/><text x="${mx-18}" y="${my+5}" font-family="'Poppins',sans-serif" font-size="7" font-weight="800" fill="#669933">FLH</text></svg>`;
}

function scInv(){const fl=S.invFlt,list=fl==='all'?DB.inv:DB.inv.filter(i=>i.s===fl);const paid=DB.inv.filter(i=>i.s==='paid').length,out=DB.inv.filter(i=>i.s==='outstanding').length;return `<div class="hdr"><button class="bk" onclick="back()"><svg viewBox="0 0 16 16"><path d="M10 4l-6 4 6 4"/></svg></button><div class="hdrt">Facturen</div></div><div style="padding:16px 18px;background:var(--bg)"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">${[['Betaald',''+paid,'var(--gsel)','var(--gd)'],['Totaal','€'+(paid*79.95).toFixed(0),'var(--wh)','var(--blk)'],['Openstaand',''+out,out>0?'#FEF3C7':'var(--wh)',out>0?'#B45309':'var(--blk)']].map(([l,v,bg,c])=>`<div style="background:${bg};border-radius:12px;padding:13px 11px;border:1px solid var(--b1)"><div style="font-size:9px;font-weight:700;color:${c};opacity:.65;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;font-family:var(--fh)">${l}</div><div style="font-family:var(--fh);font-size:20px;font-weight:800;color:${c}">${v}</div></div>`).join('')}</div><div class="pills" style="margin-bottom:14px"><button class="pill ${fl==='all'?'on':''}" onclick="S.invFlt='all';R()">Alle</button><button class="pill ${fl==='paid'?'on':''}" onclick="S.invFlt='paid';R()">Betaald</button><button class="pill ${fl==='outstanding'?'on':''}" onclick="S.invFlt='outstanding';R()">Openstaand</button></div>${list.map(inv=>`<div class="li" onclick="toast('Factuur ${inv.p} wordt gedownload…')"><div class="lic" style="background:${inv.s==='paid'?'var(--gsel)':'#FEF3C7'}">${ico('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>',18).replace('currentColor',inv.s==='paid'?'var(--g)':'#B45309')}</div><div class="lib"><div class="litt">${inv.p}</div><div class="lisc">${inv.d} · €${inv.a.toFixed(2)}</div></div><div class="lir">${inv.s==='paid'?`<span class="chip cg">Betaald</span>`:`<span class="chip ca">Openstaand</span>`}</div></div>`).join('')}<div style="height:14px">< function wizBar(){const s=S.wiz.step;if(s>4)return '';const lbls=['Serviceverzoek','Kies locatie','Datum & tijdvak','Bevestigen'];return `<div style="padding:12px 20px 0;background:var(--wh);border-bottom:1.5px solid var(--b2)"><div style="display:flex;gap:5px;margin-bottom:7px">${[1,2,3,4].map(i=>`<div class="pseg ${i<s?'dn':i===s?'ac':''}"></div>`).join('')}</div><div style="font-size:10px;font-weight:700;color:var(--gr2);letter-spacing:.4px;text-transform:uppercase;padding-bottom:10px;font-family:var(--fh)">Stap ${s} van 4 — ${lbls[s-1]||''}</div></div>`;}

${s===3?`<div style="font-family:var(--fh);font-size:15px;font-weight:700;color:var(--blk);margin-bottom:4px">Kies een datum</div><div style="font-size:12px;font-weight:500;color:var(--gr);margin-bottom:14px">Wanneer komt het u uit?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">${DATES.map(d=>{const l=d.getDate()+' '+MNS[d.getMonth()];return `<button class="dbt ${W.date===l?'on':''}" onclick="selDate('${l}')"><div class="dday">${DAYS[d.getDay()]}</div><div class="dnum">${d.getDate()}</div><div class="dmon">${MNS[d.getMonth()]}</div></button>`}).join('')}</div><div class="fld"><div class="flbl">Tijdvak</div><select class="fi" onchange="S.wiz.time=this.value"><option>Ochtend (9:00–12:00)</option><option>Middag (12:00–17:00)</option></select></div><button class="btn ${W.date?'bp':'bd'}" id="wb3" onclick="S.wiz.date&&(S.wiz.step++,R())">Volgende stap</button>`:''}

<div style="height:14px"></div></div>`;}

function scSvcList(){const act=DB.req.filter(r=>r.status!=='completed'),done=DB.req.filter(r=>r.status==='completed');return `<div class="hdr"><div class="hdrt">Mijn meldingen</div><button style="background:var(--g);color:#fff;border:2px solid var(--gd);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fh)" onclick="S.wiz={step:1,issue:'',iLbl:'',desc:'',loc:'',date:'',time:'Ochtend (9:00–12:00)'};go('svc_new')">+ Nieuw</button></div><div style="padding:16px 18px;background:var(--bg)">${act.length?`<div style="font-size:10px;font-weight:700;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-family:var(--fh)">Actief</div>`:''}${act.map(r=>`<div class="li" onclick="go('svc_detail',{id:'${r.id}'})"><div class="lic" style="background:#FEF3C7">${ico('<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',18).replace('currentColor','#B45309')}</div><div class="lib"><div class="litt">${r.cat}</div><div class="lisc">${r.loc} · ${r.date}</div></div><div class="lir">${sCh(r.status)}</div></div>`).join('')}${done.length?`<div style="font-size:10px;font-weight:700;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 10px;font-family:var(--fh)">Afgerond</div>`:''}${done.map(r=>`<div class="li" onclick="go('svc_detail',{id:'${r.id}'})"><div class="lic" style="background:var(--gsel)">${ico('<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',18).replace('currentColor','var(--g)')}</div><div class="lib"><div class="litt">${r.cat}</div><div class="lisc">${r.loc} · ${r.date}</div></div><div class="lir">${sCh(r.status)}</div></div>`).join('')}<div style="height:14px"></div></div>`;}

function scSvcDet(){const id=S.p.id,r=DB.req.find(x=>x.id===id)||DB.req[0];return `<div class="hdr"><button class="bk" onclick="back()"><svg viewBox="0 0 16 16"><path d="M10 4l-6 4 6 4"/></svg></button><div class="hdrt">Melding #${r.id.replace('s','')}</div>${sCh(r.status)}</div><div style="padding:16px 18px;background:var(--bg)"><div class="card"><div class="card-t">Details</div><div class="row"><span class="rk">Categorie</span><span class="rv">${r.cat}</span></div><div class="row"><span class="rk">Omschrijving</span><span class="rv" style="font-size:12px">${r.desc}</span></div><div class="row"><span class="rk">Locatie</span><span class="rv">${r.loc}</span></div><div class="row"><span class="rk">Datum</span><span class="rv">${r.date}</span></div><div class="row"><span class="rk">Kosten</span><span class="rv g">€ 0,00 inbegrepen</span></div></div><div class="sec"><span class="sect">Status tijdlijn</span></div><div class="card">${r.hist.map((h,i,a)=>`<div class="trow" style="${i===0?'padding-top:0':''}${i===a.length-1?';padding-bottom:0':''}"><div class="tdot ${h.ok?'ok':''}">${h.ok?ico('<path d="M5 12l4 4 9-9"/>',11).replace('currentColor','var(--g)'):`<div style="width:6px;height:6px;border-radius:50%;background:var(--b2);margin:auto"></div>`}</div><div><div class="tname ${h.ok?'':'dim'}">${h.s}</div>${h.t?`<div class="tsub">${h.t}</div>`:''}</div></div>`).join('')}</div>${r.status!=='completed'?`<button class="btn bs" onclick="demoSt('${r.id}')">Demo: volgende status →</button>`:''}<div style="height:14px"></div></div>`;}

function scQR(){const b=DB.b;return `<div style="background:var(--wh);border-bottom:1.5px solid var(--b2);padding:18px 20px"><div style="font-family:var(--fh);font-size:18px;font-weight:800;color:var(--blk);margin-bottom:3px">Mijn QR-code</div><div style="font-size:13px;font-weight:500;color:var(--gr)">Toon aan servicepartner bij inlevering</div></div><div style="padding:16px 18px;background:var(--bg)"><div class="card" style="text-align:center;padding:24px"><div style="font-size:10px;font-weight:700;color:var(--gr2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:18px;font-family:var(--fh)">Scan voor fietsinformatie</div><div style="display:inline-block;background:var(--wh);border-radius:12px;padding:14px;border:1px solid var(--b1)">${genQR(b.tok)}</div><div style="margin-top:12px"><div style="font-size:10px;font-weight:700;color:var(--gr2)">Beveiligde token</div><div style="font-family:monospace;font-size:10px;color:var(--gr2);margin-top:2px">${b.tok}</div></div></div><div class="card"><div class="card-t">Gekoppelde fiets</div><div class="row"><span class="rk">Model</span><span class="rv">${b.brand} ${b.model}</span></div><div class="row"><span class="rk">Framenummer</span><span class="rv">${b.frame}</span></div><div class="row"><span class="rk">Garantie tot</span><span class="rv">${b.warranty}</span></div></div><button class="btn bp" onclick="toast('Framenummer gekopieerd: ${b.frame}')" style="margin-bottom:10px">Framenummer kopiëren</button><div class="nbx" style="margin-top:0">${ico('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',14).replace('currentColor','var(--g)')}<p>De QR-code bevat een beveiligde token. Persoonsgegevens zijn niet zichtbaar bij het scannen.</p></div><div style="height:14px"></div></div>`;}

function scFaq(){if(S.faqTab==='chat')return scChat();const cats=[{k:'all',l:'Alle'},{k:'contract',l:'Contract'},{k:'betaling',l:'Betaling'},{k:'fiets',l:'Fiets'},{k:'service',l:'Service'}];const faqs=S.faqCat==='all'?DB.faq:DB.faq.filter(f=>f.cat===S.faqCat);return `<div class="hdr"><div class="hdrt">Help & FAQ</div></div><div style="padding:16px 18px;background:var(--bg)"><button onclick="S.faqTab='chat';R()" style="width:100%;display:flex;gap:12px;align-items:center;background:var(--blk);border-radius:14px;padding:14px 16px;border:2px solid #3a3c3d;cursor:pointer;margin-bottom:16px;text-align:left"><div style="width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0"></div><div style="flex:1"><div style="font-family:var(--fh);font-size:14px;font-weight:700;color:var(--wh);margin-bottom:2px">AI-assistent</div><div style="font-size:12px;font-weight:500;color:rgba(239,239,239,.45)">Contractspecifieke antwoorden</div></div>${ico('<path d="M5 12h14M13 6l6 6-6 6"/>',17).replace('currentColor','rgba(239,239,239,.4)')}</button><div class="srch"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M12 12l3 3"/></svg><input class="si2" placeholder="Zoek in veelgestelde vragen…" oninput="fltFaq(this.value)"/></div><div class="pills" style="margin-bottom:14px">${cats.map(c=>`<button class="pill ${S.faqCat===c.k?'on':''}" onclick="S.faqCat='${c.k}';R()">${c.l}</button>`).join('')}</div><div style="background:var(--wh);border-radius:14px;border:1px solid var(--b1);padding:0 16px">${faqs.map(f=>`<div class="faqit" data-id="${f.id}"><div class="faqq" onclick="tglFaq('${f.id}')"><span class="faqq-t">${f.q}</span><svg viewBox="0 0 15 14"><path d="M2 5l5.5 5.5 5.5-5.5"/></svg></div><div class="faqa">${f.a}</div></div>`).join('')}</div><div style="height:14px"></div></div>`;}

function scChat(){return `<div class="hdr"><button class="bk" onclick="S.faqTab='faq';R()"><svg viewBox="0 0 16 16"><path d="M10 4l-6 4 6 4"/></svg></button><div class="hdrt">AI-assistent</div><div style="width:8px;height:8px;border-radius:50%;background:var(--g)"></div></div><div id="chatb" style="flex:1;overflow-y:auto;background:var(--bg)"><div style="display:flex;flex-direction:column;padding:16px" id="chatmsgs">${DB.chat.map(m=>m.r==='typing'?`<div class="cm bot"><div class="cav" style="background:var(--gsel);color:var(--g)">AI</div><div class="cb"><div style="display:flex;gap:3px;padding:2px 0"><div class="tyd"></div><div class="tyd"></div><div class="tyd"></div></div></div></div>`:`<div class="cm ${m.r==='user'?'u':'bot'}">${m.r==='bot'?`<div class="cav" style="background:var(--gsel);color:var(--g)">AI</div>`:''}<div class="cb">${m.t}</div>${m.r==='user'?`<div class="cav" style="background:var(--g);color:#fff">JB</div>`:''}</div>`).join('')}</div></div><div style="display:flex;gap:8px;padding:10px 16px 14px;border-top:1.5px solid var(--b2);background:var(--wh)"><input class="ci" id="ci" placeholder="Stel uw vraag…" onkeydown="if(event.key==='Enter')sendChat()"/><button class="csnd" onclick="sendChat()">${ico('<path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/>',15).replace('currentColor','#fff')}</button></div>`;}

function scNotifs(){return `<div class="hdr"><button class="bk" onclick="back()"><svg viewBox="0 0 16 16"><path d="M10 4l-6 4 6 4"/></svg></button><div class="hdrt">Meldingen</div><button onclick="DB.not.forEach(n=>n.read=true);toast('Alles gelezen');R()" style="font-size:12px;font-weight:700;color:var(--g);background:none;border:none;cursor:pointer;font-family:var(--fh)">Alles lezen</button></div><div style="padding:14px 18px;background:var(--bg)">${DB.not.map(n=>`<div class="li" style="${n.read?'opacity:.65':''}" onclick="markRead('${n.id}');${n.sid?`go('svc_detail',{id:'${n.sid}'})`:`go('${n.nav}')`}"><div style="width:9px;height:9px;border-radius:50%;background:${n.col};flex-shrink:0;margin-top:1px"></div><div class="lib"><div class="litt" style="${!n.read?'font-weight:800':'font-weight:600'}">${n.title}</div><div class="lisc">${n.body}</div><div style="font-size:10px;font-weight:700;color:var(--gr2);margin-top:3px">${n.t}</div></div><div class="lir">${!n.read?`<span class="chip cg" style="font-size:9px">Nieuw</span>`:''}</div></div>`).join('')}<div style="height:14px"></div></div>`;}

function scPro(){return `<div style="background:var(--blk);padding:28px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:66px;height:66px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:20px;font-weight:800;color:#fff;border:3px solid var(--gl)">JB</div><div style="font-family:var(--fh);font-size:17px;font-weight:800;color:var(--wh)">Jan van den Berg</div><div style="font-size:12px;font-weight:500;color:rgba(239,239,239,.45)">jan@example.nl</div><span style="background:var(--g);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--fh)">Klant sinds okt 2023</span></div><div style="padding:16px 18px;background:var(--bg)"><div class="msec">Account</div><div class="mit" onclick="toast('Persoonlijke gegevens')"><div class="mic" style="background:var(--gsel);color:var(--g)">${ico('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>',17)}</div><span class="mitt">Persoonlijke gegevens</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div><div class="mit" onclick="toast('Beveiliging')"><div class="mic" style="background:var(--gsel);color:var(--g)">${ico('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',17)}</div><span class="mitt">Beveiliging & wachtwoord</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div><div class="mit" onclick="toast('Betaalgegevens')"><div class="mic" style="background:#FEF3C7;color:#B45309">${ico('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',17)}</div><span class="mitt">Betaalgegevens (IBAN)</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div><div class="msec">Voorkeuren</div><div class="mit" onclick="toast('Pushberichten')"><div class="mic" style="background:var(--b3);color:var(--gr)">${ico('<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>',17)}</div><span class="mitt">Pushberichten</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div><div class="msec">Juridisch</div><div class="mit"><div class="mic" style="background:var(--b3);color:var(--gr)">${ico('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',17)}</div><span class="mitt">Privacybeleid & AVG</span><div class="chv">${ico('<path d="M9 18l6-6-6-6"/>',15)}</div></div><button style="background:var(--reb);color:var(--re);border:2px solid #FECACA;border-radius:12px;padding:14px 20px;font-size:14px;font-weight:700;width:100%;margin-top:18px;cursor:pointer;font-family:var(--fh)" onclick="S.sc='login';S.stk=[];R()">Uitloggen</button><div style="height:14px"></div></div>`;}

function scPScan(){if(DB.scanP==='found'){const b=DB.b;return `<div class="scan-bg"><div style="text-align:center"><div style="width:62px;height:62px;border-radius:50%;background:var(--gsel);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:2px solid var(--gselb)">${ico('<path d="M5 12l5 5L20 7"/>',27).replace('currentColor','var(--g)')}</div><div style="font-family:var(--fh);font-size:19px;font-weight:800;color:var(--wh);margin-bottom:4px">Fiets gevonden!</div></div><div style="background:rgba(255,255,255,.06);border-radius:14px;padding:16px;width:100%;border:1px solid rgba(255,255,255,.09)"><div style="font-family:var(--fh);font-size:14px;font-weight:800;color:var(--wh);margin-bottom:8px">${b.brand} ${b.model}</div><div style="font-size:12px;font-weight:500;color:rgba(239,239,239,.5)">Frame: ${b.frame}</div></div><button style="background:var(--g);color:#fff;border:2px solid var(--gd);border-radius:12px;padding:14px 20px;font-size:14px;font-weight:700;width:100%;cursor:pointer;font-family:var(--fh)" onclick="go('bike')">Fietsdetails bekijken →</button><button style="width:100%;background:transparent;border:1.5px solid rgba(239,239,239,.15);border-radius:12px;padding:13px;color:rgba(239,239,239,.5);font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer" onclick="DB.scanP='scan';R()">Opnieuw scannen</button></div>`;}
  return `<div class="scan-bg"><div style="text-align:center"><div style="font-family:var(--fh);font-size:17px;font-weight:800;color:var(--wh);margin-bottom:4px">QR-code scannen</div><div style="font-size:12px;font-weight:500;color:rgba(239,239,239,.35)">Richt op de QR-code van de fiets</div></div><div class="sfr"><div class="sfbg"><div class="sline"></div><div class="cor tl"></div><div class="cor tr"></div><div class="cor bl"></div><div class="cor br"></div></div></div><button style="background:var(--g);color:#fff;border:2px solid var(--gd);border-radius:12px;padding:14px 20px;font-size:14px;font-weight:700;width:100%;cursor:pointer;font-family:var(--fh)" onclick="DB.scanP='found';R()">Nu simuleren</button><button onclick="go('home')" style="width:100%;background:transparent;border:1.5px solid rgba(239,239,239,.12);border-radius:12px;padding:13px;color:rgba(239,239,239,.4);font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer">Annuleren</button></div>`;}

function selLoc(id){S.wiz.loc=id;document.querySelectorAll('.loc').forEach(l=>{const on=l.getAttribute('onclick')?.includes(`'${id}'`);l.classList.toggle('on',on);const r=l.querySelector('.radio');if(r){r.style.borderColor=on?'var(--g)':'var(--b1)';r.style.background=on?'var(--g)':'var(--wh)';}const d=l.querySelector('.rdot');if(d)d.style.opacity=on?'1':'0';});const b=document.getElementById('wb2');if(b)b.className='btn bp';}
function selDate(lbl){S.wiz.date=lbl;document.querySelectorAll('.dbt').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')?.includes(`'${lbl}'`)));const b=document.getElementById('wb3');if(b)b.className='btn bp';}
function submitReq(){const id='s'+Math.floor(2300+Math.random()*100);DB.req.unshift({id,cat:'Service',desc:'Via Tally-formulier ingediend',status:'submitted',loc:LOCS.find(l=>l[0]===S.wiz.loc)?.[2]?.split('—')[0].trim()||'Partner',date:(S.wiz.date||'10 apr')+' 2025',made:'8 apr 2025',hist:[{s:'Ingediend',t:'8 apr, '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),ok:true},{s:'Toegewezen',t:'',ok:false},{s:'In behandeling',t:'',ok:false},{s:'Afgerond',t:'',ok:false}]});DB.not.unshift({id:'n_new',title:'Melding ingediend',body:'Uw serviceverzoek is ontvangen.',t:'Zojuist',read:false,col:'var(--g)',nav:'svc_list'});S.wiz.step=5;R();}
function demoSt(id){const r=DB.req.find(x=>x.id===id);if(!r)return;const nx={submitted:'assigned',assigned:'in_progress',in_progress:'completed'};const nl={submitted:'Toegewezen',assigned:'In behandeling',in_progress:'Afgerond'};if(!nx[r.status])return;r.status=nx[r.status];const h=r.hist.find(x=>!x.ok);if(h){h.ok=true;h.t='8 apr, '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}toast('Status: '+(nl[r.status]||'Bijgewerkt'));R();}
function markRead(id){const n=DB.not.find(x=>x.id===id);if(n)n.read=true;}
function tglFaq(id){const el=document.querySelector(`.faqit[data-id="${id}"]`);if(el){const was=el.classList.contains('op');document.querySelectorAll('.faqit').forEach(x=>x.classList.remove('op'));if(!was)el.classList.add('op');}}
function fltFaq(v){const q=v.toLowerCase();document.querySelectorAll('.faqit').forEach(el=>{const t=el.querySelector('.faqq-t')?.textContent.toLowerCase()||'';const a=el.querySelector('.faqa')?.textContent.toLowerCase()||'';el.style.display=(t.includes(q)||a.includes(q))?'block':'none';});}
function getAIR(t){const l=t.toLowerCase();if(l.includes('onderhoud'))return 'Uw fiets heeft recht op één grote beurt per jaar. Laatste beurt: 15 september 2024.';if(l.includes('factuur')||l.includes('betaal'))return 'Factuur april 2025 (€79,95) staat open. SEPA-incasso op 1e van de maand.';if(l.includes('diefstal'))return 'Bij diefstal: (1) aangifte politie, (2) noteer nummer, (3) meld via Service tab.';if(l.includes('contract'))return 'Contract FLH-2023-4721 loopt tot 1 oktober 2026. Nog 18 maanden te gaan.';return 'Bedankt. Bel voor complexe zaken: 085-060 1234 (ma–vr 9–17u).';}
function iChat(){const i=document.getElementById('ci');if(i)i.focus();const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;}
function sendChat(){const i=document.getElementById('ci');if(!i)return;const txt=i.value.trim();if(!txt)return;i.value='';DB.chat.push({r:'user',t:txt},{r:'typing',t:''});R();setTimeout(()=>{DB.chat=DB.chat.filter(m=>m.r!=='typing');DB.chat.push({r:'bot',t:getAIR(txt)});R();setTimeout(()=>{const m=document.getElementById('chatb');if(m)m.scrollTop=m.scrollHeight;},80);},1500);}

R();
setInterval(()=>{const e=document.getElementById('st');if(e){const n=new Date();e.textContent=`${n.getHours()}:${('0'+n.getMinutes()).slice(-2)}`;}},30000);
</script>
